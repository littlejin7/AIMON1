services:
  - type: web
    name: ai-mon-backend
    env: python
    rootDir: ai-mon/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # Set to "true" in the Render dashboard for Supabase mode.
      - key: USE_SUPABASE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Single instance: set to "1". In multi-worker deployments, enable the scheduler in only one process.
      - key: RUN_SCHEDULER
        sync: false

name: Notion Sync All Files

on:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Push All MD files to Notion
        uses: anyer97/github-action-md-to-notion@v1
        with:
          notion-token: ${{ secrets.NOTION_TOKEN }}
          notion-page-id: ${{ secrets.NOTION_PAGE_ID }}
          # 특정 파일 하나가 아니라, ai-mon 폴더 안의 모든 마크다운(.md) 파일을 다 보냅니다!
          file-path: './ai-mon/**/*.md'
